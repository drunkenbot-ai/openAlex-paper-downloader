name: Build Executables

# Builds a standalone PyInstaller executable for Windows, macOS, and
# Linux on every push/PR that touches the app, and publishes them as
# workflow artifacts. Pushing a tag like "v1.0.0" additionally attaches
# the three builds to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "paper_app/**"
      - "paper_cleaner/**"
      - "build.spec"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "paper_app/**"
      - "paper_cleaner/**"
      - "build.spec"
      - "requirements.txt"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PaperCorpusBuilder-windows
            build_path: dist/PaperCorpusBuilder.exe
          - os: macos-latest
            artifact_name: PaperCorpusBuilder-macos
            build_path: dist/PaperCorpusBuilder.app
          - os: ubuntu-latest
            artifact_name: PaperCorpusBuilder-linux
            build_path: dist/PaperCorpusBuilder

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller build.spec --noconfirm

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent PaperCorpusBuilder.app \
            ../PaperCorpusBuilder-macos.zip

      - name: Upload artifact (Windows/Linux)
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.build_path }}

      - name: Upload artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: PaperCorpusBuilder-macos.zip

  release:
    name: Attach builds to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PaperCorpusBuilder-windows/*
            artifacts/PaperCorpusBuilder-macos/*
            artifacts/PaperCorpusBuilder-linux/*
